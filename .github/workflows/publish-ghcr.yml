name: Validate SoloHost probe

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: |
          python -m py_compile server.py
          python -m py_compile playbooks.py
          python -m py_compile evidence-bridge/app.py

      - name: Run full regression suite
        run: python -m unittest discover -s tests -v

      - name: Build SoloHost container
        run: docker build -t livingpanda-pi-solohost-probe:ci .

      - name: Build evidence bridge container
        run: docker build -t livingpanda-pi-evidence-bridge:ci evidence-bridge

