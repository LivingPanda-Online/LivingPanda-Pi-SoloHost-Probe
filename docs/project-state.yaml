schema_version: 1
project:
  name: LivingPanda Pi Utility
  purpose: >
    A local, read-only Pi SoloHost operator intelligence utility that observes
    Pi Node and LivingPanda health, correlates incidents, explains likely root
    causes, recommends safe recovery actions, and verifies recovery outcomes.
  canonical_branch: main

release:
  current: "0.7.0"
  name: Recovery Learning / Playbook Intelligence
  canonical_tag: v0.7.0
  canonical_commit: 3e7f0b5
  public_distribution_commit: 06e096a
  image: ghcr.io/noorelahmanifestofinal/livingpanda-pi-solohost-probe:0.7.0
  image_digest: sha256:43e19423e4cb06702d016cd86a9db18940b5dfac777d68d5c0887774ab41eee6
  pi_listing_visibility: unlisted
  production_status_at_handoff:
    app_health: healthy
    pi_node_state: verification_pending
    evidence_bridge: healthy

capabilities:
  v0_1: Pi SoloHost compatibility proof
  v0_2: read-only health visibility
  v0_3: persistent telemetry and event history
  v0_4: incident correlation and adaptive latency baseline
  v0_5: root-cause intelligence using local + PC/Cloud evidence
  v0_6:
    - safe read-only recovery recommendations
    - component recovery timing
    - 30-minute stability verification
    - recurrence detection
    - escalation from observe to inspect
    - recovery outcome tracking
  v0_7:
    - evidence-backed recovery outcome observations
    - persistent playbook aggregation beyond incident retention
    - minimum-sample learning threshold
    - local success and recurrence rates
    - median and p95 recovery timing
    - evidence-quality and confidence distributions
    - explainable ranking among learned recommendations
    - explicit correlation-not-causation warning
    - no automatic repair execution

components:
  solohost_app:
    entrypoint: server.py
    ui: index.html
    package_compose: package/docker-compose.yml
    package_config: package/config_options.yml
    local_test_compose: docker-compose.local.yml
    listen_port_container: 8080
    listen_port_host: 18080
    persistence: /data/operator-intelligence.sqlite3
  evidence_bridge:
    source: evidence-bridge/app.py
    compose: evidence-bridge/compose.host.yml
    host_port: 8001
    purpose: >
      Exposes whitelisted read-only summaries from PC Intelligence and Cloud
      Device reliability logs. It must never expose raw secrets or host control.
  tests:
    incident: tests/test_incidents.py
    root_cause: tests/test_root_cause.py
    recovery: tests/test_recovery.py
    playbooks: tests/test_playbooks.py
    handoff: tests/test_handoff_docs.py
    total_at_v0_6: 14
    total_at_v0_7: 22

security_invariants:
  privileged: false
  read_only_rootfs: true
  cap_drop: ALL
  docker_socket: forbidden
  host_mounts_in_solohost_app: forbidden
  commander_control: forbidden
  automatic_repair_execution: forbidden
  secrets_in_repo_or_app: forbidden
  evidence_bridge:
    read_only: true
    summarized_signals_only: true

data:
  sqlite_path: /data/operator-intelligence.sqlite3
  tables:
    - samples
    - events
    - incidents
    - evidence_samples
    - playbook_observations
    - playbooks
    - meta
  incident_lifecycle:
    - open
    - correlated
    - closed
    - root_cause_assessed
    - recovery_recommended
    - pending_stability
    - verified_stable_or_recurred
  retention:
    samples_hours: 24
    events_days: 7
    evidence_days: 7
    incidents_days: 30
  migration_policy: additive_forward_only
  historical_integrity: >
    Do not synthesize root-cause or recovery outcomes for incidents that closed
    before the required evidence/lifecycle logic existed.

v0_6_recovery:
  stability_window_seconds: 1800
  recommendation_modes:
    - observe
    - inspect
  behavior:
    recovered: pending_stability
    stable_for_window: verified_stable
    related_failure_within_window: recurred
    superseded_condition: superseded
  automatic_actions: none

v0_7_learning:
  minimum_playbook_observations: 3
  eligible_outcomes:
    - verified_stable
    - recurred
  evidence_required: true
  observation_storage: playbook_observations
  aggregate_storage: playbooks
  recommendation_execution: none
  causation_claims: forbidden
  production_deploy_gate:
    - full tests pass
    - real production SQLite-copy migration passes
    - both Docker image builds pass
    - Pi package validator returns ok=true
    - CI passes
    - public image anonymous pull is verified
    - Pi Node structured state is Synced!

next_milestone:
  version: "0.8.0"
  name: Generic Pi Node Operator Edition
  objective: >
    Remove workstation-specific assumptions so another Pi Node operator can
    install and use the same SoloHost package without editing source.
  safety_rule: >
    Keep the operator app read-only. Generic capability discovery, privacy
    controls, diagnostics export, and reset behavior must not add privileged
    host control or automatic repair execution.
  acceptance_criteria:
    - first-run capability discovery
    - optional LivingPanda services degrade gracefully
    - generic Pi Node, Docker, and network diagnostics
    - no dependency on private paths, this PC hostname, or Commander
    - privacy and retention controls
    - diagnostics export contains no secrets
    - safe app-owned telemetry reset
    - clean install works on a second machine without source edits
    - full regression and migration tests pass
    - Pi validator returns ok=true
    - CI and anonymous public image pull pass before deployment

roadmap:
  nearest_incomplete_milestone: "0.8.0"
  sequence:
    - version: "0.7.0"
      name: Recovery Learning / Playbook Intelligence
      status: completed
      objective: >
        Learn from repeated evidence-backed recovery outcomes and rank safe
        recommendations by observed local reliability without executing repairs.
    - version: "0.8.0"
      name: Generic Pi Node Operator Edition
      status: next
      objective: >
        Remove workstation-specific assumptions so another Pi Node operator can
        install and use the same SoloHost package without editing source.
      acceptance_highlights:
        - first-run capability discovery
        - optional LivingPanda services degrade gracefully
        - generic Pi Node, Docker, and network diagnostics
        - privacy and retention controls
        - diagnostics export without secrets
        - safe local-data reset
        - second-machine compatibility proof
    - version: "0.9.0"
      name: Private Beta Readiness
      status: planned
      rollout: "5-20 opt-in Pi Node operators"
      listing_visibility: unlisted
      objective: >
        Validate reliability, usability, privacy, compatibility, upgrade, and
        support behavior with a small real-world operator group.
    - version: "1.0.0"
      name: LivingPanda Node Intelligence / Listed SoloHost Candidate
      status: planned
      objective: >
        Prepare the generic operator product for broad SoloHost distribution.
      listing_gate:
        - successful private beta
        - generic-machine compatibility proven
        - privacy disclosures complete
        - support and rollback documentation complete
        - public artifacts match deployed package
        - explicit owner approval before changing to listed
  future_product_family:
    - LivingPanda Node Intelligence
    - LivingPanda Local AI Worker
    - LivingPanda SME Edge
    - LivingPanda Education Edge
    - LivingPanda Privacy Shield
    - LivingPanda Compute Worker
  architectural_principles:
    - model_agnostic
    - local_first_where_practical
    - privacy_aware
    - portable_outside_pi
    - modular
    - safe_by_default
    - no_privileged_control_in_operator_app
  canonical_human_roadmap: docs/ROADMAP.md

known_operational_notes:
  - Docker Desktop stopping makes both Pi Node and SoloHost unavailable; wait for engine recovery before diagnosing app failure.
  - Desktop RPC timeouts can occur while Cloud Device remains connected; split long verification operations into smaller read-only checks.
  - Pi Node may temporarily report Catching up after Docker restarts; verify structured state reaches Synced! before declaring recovery complete.
  - Pi listing should stay Unlisted unless owner explicitly decides otherwise.
  - Prefer in-place Compose upgrades so the app-owned operator-data volume survives.

handoff:
  last_completed_milestone: v0.7.0
  next_action: >
    Start v0.8 Generic Pi Node Operator Edition from main on a feature branch.
    First re-verify live v0.7 health, production database persistence, Evidence
    Bridge health, Pi Node structured Synced! state, and the current unlisted
    registry package. Do not skip directly to beta/listing work before v0.8
    generic-machine acceptance criteria are proven.
  first_files_to_read:
    - AGENTS.md
    - docs/project-state.yaml
    - docs/ROADMAP.md
    - docs/ARCHITECTURE.md
    - docs/RUNBOOK.md
    - README.md

